<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126ac2"><link rel="manifest" href="manifest.json"><title>Elevor360D Spot the Difference</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf7ff;font:17px system-ui;color:#17365a}main{max-width:1000px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(25px,5vw,42px);margin:12px 0}button,select{font:inherit;border:0;border-radius:12px;padding:12px;background:#126ac2;color:white;cursor:pointer}button:disabled{opacity:.5}select{background:white;color:#17365a;border:1px solid #b9d5ec}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.scene{width:100%;display:block;border:4px solid white;border-radius:16px;touch-action:manipulation;background:white}.target{cursor:pointer}.target:focus-visible{outline:3px solid #ff9500}.panel{background:white;border-radius:16px;padding:14px;margin:12px 0}progress{width:100%;height:20px}dialog{border:0;border-radius:22px;text-align:center;max-width:90%;padding:30px}dialog::backdrop{background:#1239}.star{font-size:65px;animation:bounce .6s infinite alternate}@keyframes bounce{to{transform:translateY(-12px) rotate(8deg)}}@media(max-width:580px) and (orientation:portrait){.boards{grid-template-columns:1fr}.scene{max-height:35vh}}@media(prefers-reduced-motion:reduce){.star{animation:none}}</style><main><header><b>Elevor360D • Kids Games</b><button id="install">Install App</button></header><h1>🔍 Spot the Difference</h1><p>Look at both pictures. Tap anything that is different!</p><div class="controls"><label>Scene <select id="theme"></select></label><label>Level <select id="level"><option value="5">Easy – 5</option><option value="10">Hard – 10</option></select></label><button id="new">New game</button></div><div class="panel"><strong id="score"></strong><progress id="progress"></progress><div id="message" role="status" aria-live="polite"></div></div><div class="boards"><div><b>Picture A</b><svg id="a" class="scene" viewBox="0 0 400 300"></svg></div><div><b>Picture B</b><svg id="b" class="scene" viewBox="0 0 400 300"></svg></div></div><div class="controls"><button id="hint">💡 Hint</button><button id="sound">Sound: on</button></div><p>Play at your own pace. No timer!</p><dialog id="win"><div class="star">🏆</div><h2>Fantastic! You win!</h2><p>You found every difference!</p><button id="again">Play again</button> <button id="close">View pictures</button></dialog></main><script>
const $=id=>document.getElementById(id), themes={Farm:['🐄','🐑','🚜','🐓','🐖','🐴','🌻','🐕','🍎','🦋','🐥','🐈'],Beach:['🏖️','🐚','🦀','🐬','🪁','🛟','🍦','🐠','⛵','🦩','🪣','🌴'],Park:['🛝','⚽','🚲','🪁','🐕','🌷','🦋','🐦','🎈','🛹','🍦','🌳'],Woodland:['🦊','🦉','🐿️','🦌','🍄','🐇','🦋','🌲','🐌','🐦','🌼','🦔'],Underwater:['🐠','🐙','🐢','🦀','🐬','🐚','🪸','🦈','🐡','🦐','⭐','🪼']};let s, hint=-1, promptInstall;const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};for(const t of Object.keys(themes))$('theme').add(new Option(t,t));function save(){try{localStorage.setItem('spot-v1',JSON.stringify(s))}catch{}}function fresh(){s={theme:$('theme').value,n:+$('level').value,diff:shuffle([...Array(12).keys()]).slice(0,+$('level').value),found:[],sound:s?.sound??true,items:shuffle([...themes[$('theme').value]])};hint=-1;save();render();$('message').textContent='Find the hidden changes!'}function beep(){if(!s.sound)return;try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=650;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.13);o.onended=()=>c.close()}catch{}}function tap(i){if(s.found.includes(i))return;if(!s.diff.includes(i)){$('message').textContent='Not quite — keep looking!';return}s.found.push(i);hint=-1;beep();save();render();$('message').textContent='Great spotting!';if(s.found.length===s.n)$('win').showModal()}function render(){let water=s.theme==='Underwater',beach=s.theme==='Beach';for(const side of ['a','b']){let svg=$(side);svg.innerHTML=`<rect width="400" height="300" fill="${water?'#78d7ef':'#a9e5ff'}"/><circle cx="350" cy="35" r="24" fill="${water?'#a6f4ff':'#ffe46c'}"/><path d="M0 145 Q100 96 200 151 T400 140 V300 H0Z" fill="${water?'#37b9d2':beach?'#f8df9c':'#9bd56b'}"/><path d="M0 230 Q120 196 240 237 T400 218 V300 H0Z" fill="${water?'#e6c995':beach?'#f5c971':'#6abf65'}"/>`;s.items.forEach((item,i)=>{let x=52+i%4*98,y=65+Math.floor(i/4)*91,changed=side==='b'&&s.diff.includes(i),missing=changed&&i%3===0, shown=changed&&i%3===1?s.items[(i+1)%12]:item;svg.insertAdjacentHTML('beforeend',`<g class="target" role="button" tabindex="0" aria-label="Picture ${side.toUpperCase()}, area ${i+1}" data-i="${i}"><rect x="${x-43}" y="${y-38}" width="86" height="78" fill="transparent"/>${missing?'':`<text x="${x}" y="${y+14}" text-anchor="middle" font-size="${changed&&i%3===2?28:48}" pointer-events="none">${shown}</text>`}${s.found.includes(i)||hint===i?`<circle cx="${x}" cy="${y}" r="38" fill="none" stroke="${s.found.includes(i)?'#159447':'#ff9900'}" stroke-width="4" stroke-dasharray="${hint===i?'6 4':'none'}" pointer-events="none"/>`:''}</g>`)});svg.querySelectorAll('[data-i]').forEach(g=>{g.onclick=()=>tap(+g.dataset.i);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(+g.dataset.i)}}})}$('score').textContent=`Differences found: ${s.found.length} / ${s.n}`;$('progress').max=s.n;$('progress').value=s.found.length;$('hint').disabled=s.found.length===s.n;$('sound').textContent='Sound: '+(s.sound?'on':'off')}
try{s=JSON.parse(localStorage.getItem('spot-v1'))}catch{}if(s&&themes[s.theme]&&Array.isArray(s.items)&&Array.isArray(s.diff)&&Array.isArray(s.found)){$('theme').value=s.theme;$('level').value=s.n;render()}else fresh();$('new').onclick=()=>{if(!s.found.length||s.found.length===s.n||confirm('Start a new puzzle?'))fresh()};for(let id of ['theme','level'])$(id).onchange=()=>{if(s.found.length&&s.found.length<s.n&&!confirm('Start a new puzzle?')){$('theme').value=s.theme;$('level').value=s.n}else fresh()};$('hint').onclick=()=>{hint=s.diff.find(i=>!s.found.includes(i));render();$('message').textContent='Look inside the orange circles!'};$('sound').onclick=()=>{s.sound=!s.sound;save();render()};$('close').onclick=()=>$('win').close();$('again').onclick=()=>{$('win').close();fresh()};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstall=e});$('install').onclick=async()=>{if(promptInstall){await promptInstall.prompt();promptInstall=null}else alert('Open the browser menu and choose Install app or Add to Home Screen. On iPhone use Safari Share → Add to Home Screen.')};if(matchMedia('(display-mode: standalone)').matches)$('install').hidden=true;window.addEventListener('appinstalled',()=>$('install').hidden=true);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
